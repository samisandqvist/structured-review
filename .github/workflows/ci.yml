name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # macOS support was verified on run 29583867228 (commit a972afb): the full
    # suite incl. real indexers and the bundle rebuild passed on macos-latest.
    # Removed from the matrix afterwards to save runner minutes — re-add
    # `macos-latest` here if a platform-sensitive area changes (spawning,
    # paths, indexer resolution).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      # coursier (`cs`) lets the scip-java integration test run for real;
      # without it the test self-skips and Java coverage silently drops.
      # JDK + Maven are preinstalled on ubuntu runners.
      - uses: coursier/setup-action@v1

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # Both host packages ship committed bundles from one source.
      # Fail when a runtime change was pushed without rebuilding it.
      - name: Plugin bundle freshness
        run: |
          pnpm build:plugin
          if ! git diff --exit-code plugin/ plugins/ || [ -n "$(git status --porcelain plugin/ plugins/)" ]; then
            echo "::error::plugin bundles are stale — run 'pnpm build && pnpm build:plugin' and commit the result"
            git status --porcelain plugin/ plugins/
            exit 1
          fi
