name: Full verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install Coursier
        uses: coursier/setup-action@6f83a6f6433e2d3057fc56cc482ce8ed465c577e # v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify real indexer toolchains
        run: |
          cs version
          java -version
          mvn --version
          pnpm --filter @crw/server exec scip-typescript --version
          pnpm --filter @crw/server exec scip-python --version
          cs launch com.sourcegraph:scip-java_2.13:0.12.3 -M com.sourcegraph.scip_java.ScipJava -- --help

      - name: Cache security tool downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools/security/downloads
            .tools/security/pip-cache
          key: security-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/security/setup-tools.sh', 'security/semgrep-constraints.txt') }}

      - name: Install pinned security tools
        run: pnpm security:setup

      - name: Update offline advisory database
        run: pnpm security:update

      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Select changed-line coverage base
        run: printf 'HARNESS_BASE=HEAD^\n' >> "$GITHUB_ENV"

      - name: Run full verification including mutation tests
        run: pnpm verify:full

      - name: Upload full verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: full-verification-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            reports/
            coverage/
            playwright-report/
            test-results/

  platform-smoke:
    name: Shipped artifact smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.13.0
          - os: macos-latest
            node: 24
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Verify committed plugin artifacts
        run: pnpm plugin:check

      - name: Exercise the shipped CLI repository guard
        run: pnpm exec playwright test --grep 'rejects invalid bases'

      - name: Upload platform smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: platform-smoke-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            playwright-report/
            test-results/
